# Example: run the controller in a Cluster API management ("infra") cluster for
# the workload cluster "mycluster". Install one release per workload cluster,
# into the namespace of its Cluster object:
#
#   helm install occm-mycluster charts/openstack-cloud-controller-manager \
#     -n <cluster-namespace> -f ci/infra-values.yaml
#
# This file is also linted by hack/verify-helm-charts.sh.

kind: Deployment
replicaCount: 1

# Names must be unique per release when several releases share a namespace.
nameOverride: occm-mycluster
serviceAccountName: occm-mycluster

# Cluster API writes the workload cluster's kubeconfig to <cluster>-kubeconfig.
kubeconfig:
  secretName: mycluster-kubeconfig
  secretKey: value

# The RBAC objects would be created in the management cluster, where the
# controller does not need them. The kubeconfig above carries the permissions
# in the workload cluster.
rbac:
  create: false

# Unique per workload cluster: load balancer names are derived from it.
cluster:
  name: mycluster

# The defaults schedule onto control plane nodes of the cluster being managed,
# with host networking and the kubelet's paths mounted. None of that applies in
# the management cluster.
hostNetwork: false
dnsPolicy: ClusterFirst
# null, not {}: Helm merges maps, so {} would keep the default selector.
nodeSelector: null
tolerations: []
priorityClassName: ""
extraVolumes: []
extraVolumeMounts: []

# The route controller needs a router-id and --cluster-cidr; leave it out
# unless pod routes are managed through Neutron.
enabledControllers:
  - cloud-node
  - cloud-node-lifecycle
  - service

# Keep the OpenStack credentials and the API key out of the values: create the
# Secret yourself with a cloud.conf key.
secret:
  enabled: true
  create: false
  name: mycluster-cloud-config
