apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "occm.serviceAccountName" . }}
  labels: {{- include "occm.labels.standard" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
