# Values of the OpenStack Cloud Controller Manager Helm chart.
#
# The chart runs the controller in a Cluster API management cluster (for
# example a CAPO cluster) and manages one workload cluster from there. Install
# one release per workload cluster, into the namespace of its Cluster object,
# and name the release after the cluster (or set cluster.name):
#
#   helm install mycluster openstack-cloud-controller-manager \
#     --namespace <cluster-namespace> --values openstack-ccm.yaml
#
# The controller reads
#   - the workload cluster's kubeconfig from the Secret <cluster>-kubeconfig,
#     which Cluster API creates,
#   - its cloud.conf from the Secret <cluster>-cloud-config, which the chart
#     creates from cloudConfig and loadBalancer (or which you create, with
#     secret.create=false).
#
# The values are checked when the chart is installed, upgraded or linted:
# values.schema.json checks types, allowed values and ID formats, and
# templates/validate.yaml checks that the required values are set.

# Name of the workload cluster. Load balancer names are derived from it, so it
# must be unique among the clusters sharing an OpenStack project. Defaults to
# the release name.
cluster:
  name: ""

# Load balancers of the workload cluster, managed by the load balancer service.
# All Services of the cluster use the same mode:
#   external: every load balancer gets a floating IP from floatingNetworkID,
#             and Services are reached at the floating IP.
#   internal: no load balancer gets a floating IP, and Services are reached at
#             the load balancer's address on the cluster subnet.
# The Service annotation service.beta.kubernetes.io/openstack-internal-load-balancer
# cannot change the mode; a Service carrying a different value gets a warning event.
#
# The load balancer ports have no security groups and no QoS policy, and no
# VPC CIDR is set. These are what the controller does when security-group-ids,
# qos-policy-id and vpc-cidr are not set; they can be set under
# cloudConfig.loadBalancer.
loadBalancer:
  mode: external
  # Address of the load balancer service: host:port or http://host:port.
  # Required. https:// is not supported, the service only serves plaintext HTTP/2.
  rpcServerAddr: ""
  # Bearer token for the load balancer service. No credential is sent when empty.
  apiKey: ""
  # Project the load balancers are created in, a UUID. Defaults to the project of
  # the cloudConfig.global credentials.
  tenantID: ""
  # Network and subnet of the workload cluster's nodes, where the load
  # balancers are created. Required, UUIDs. Cluster API reports both in the
  # status of the OpenStackCluster.
  networkID: ""
  subnetID: ""
  # External network the floating IPs are allocated from, a UUID. Required when
  # mode is external, ignored when it is internal.
  floatingNetworkID: ""

# Number of controller pods. Leader election makes sure only one is active, more
# than one only shortens the failover.
replicaCount: 1

# Kubeconfig of the workload cluster. The Secret is mounted and passed as
# --kubeconfig, --authentication-kubeconfig and --authorization-kubeconfig.
kubeconfig:
  # Defaults to <cluster.name>-kubeconfig, the Secret Cluster API keeps for
  # the workload cluster.
  secretName: ""
  secretKey: value
  mountPath: /etc/kubernetes/occm-kubeconfig

# Override the names of the chart's objects. They default to the release name.
nameOverride: ""
fullnameOverride: ""

## Annotations to apply to all resources
commonAnnotations: {}
# commonAnnotations:
#   "helm.sh/hook": pre-install,pre-upgrade
#   "helm.sh/hook-weight": "-100"
#   "helm.sh/hook-delete-policy": before-hook-creation

# List of secrets to use as image pull secret
imagePullSecrets: []
# - pull-secret-1
# - pull-secret-2

# Image repository name and tag
image:
  repository: registry.k8s.io/provider-os/openstack-cloud-controller-manager
  tag: ""

# Additional containers which are run before the app containers are started.
extraInitContainers: []
# - name: wait
#   image: busybox
#   command: ['sh', '-c', 'echo waiting for 10 seconds; sleep 10;']

# Additional environment variables for the cloud-controller-manager.
extraEnv: []
# - name: OS_CCM_REGIONAL
#   value: "true"

# Set resources for the controller pod
resources: {}
# resources:
#   requests:
#     cpu: 200m

# Set livenessProbe for the controller pod. Used the same port for servicemonitor metrics
livenessProbe: {}
# livenessProbe:
#   httpGet:
#    path: /metrics
#    port: 10258

# Set readinessProbe in the same way like livenessProbe
readinessProbe: {}

# Run the pod in the host network. Only needed when the pod network of the
# management cluster cannot reach the OpenStack endpoints.
hostNetwork: false

# Set to ClusterFirstWithHostNet if hostNetwork is enabled
dnsPolicy: ClusterFirst

# Set nodeSelector where the controller should run
nodeSelector: {}

# Set tolerations for nodes where the controller should run
tolerations: []

# Optional additional annotations to add to the controller Pods.
podAnnotations: {}

# Optional additional labels to add to the controller Pods.
podLabels: {}

# Set security settings for the controller pods
# For all available options, see https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.23/#podsecuritycontext-v1-core
podSecurityContext:
  runAsUser: 1001
  seccompProfile:
    type: RuntimeDefault

# Set security settings for the controller container
# For all available options, see https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.23/#securitycontext-v1-core
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault
  allowPrivilegeEscalation: false
  runAsNonRoot: true

# List of controllers should be enabled.
# Use '*' to enable all controllers.
# Prefix a controller with '-' to disable it.
# The route controller needs [Route] router-id and --cluster-cidr, add it only
# when pod routes are managed through Neutron.
enabledControllers:
  - cloud-node
  - cloud-node-lifecycle
  - service

# Any extra arguments for openstack-cloud-controller-manager
controllerExtraArgs: ""
# controllerExtraArgs: |-
#   - --cluster-name=my-cluster

# Create a service monitor for Prometheus Operator
serviceMonitor: {}
# serviceMonitor:
#   enabled: true
#   additionalLabels: {}

# Create a secret resource <cluster.name>-cloud-config (or other name) to store credentials and settings from cloudConfig
# You can also provide your own secret (not created by the Helm chart), in this case set create to false
# and adjust the name of the secret as necessary
# If you dont want to use a secret (because you are using something like an agent injector to inject the cloud config file)
# you can disable the secret usage by setting enabled to false.
# If you disable the secret, you have to insert the cloud config file into the path /etc/cloud/config.
secret:
  enabled: true
  create: true
  # Defaults to <cluster.name>-cloud-config.
  name: ""

# Log verbosity level.
# See https://github.com/kubernetes/community/blob/master/contributors/devel/sig-instrumentation/logging.md
# for description of individual verbosity levels.
logVerbosityLevel: 2

# Specify settings with the same key as the CCM config: https://github.com/kubernetes/cloud-provider-openstack/blob/master/docs/openstack-cloud-controller-manager/using-openstack-cloud-controller-manager.md#config-openstack-cloud-controller-manager
# Keys with an empty value are left out of cloud.conf.
cloudConfig:
  # Keystone URL and credentials of the OpenStack project of the workload
  # cluster. auth-url is required, and so are the credentials: a password with
  # username, or an application credential with its secret.
  global:
    auth-url: ""
    region: ""
    username: ""
    password: ""
    user-domain-name: ""
    tenant-name: ""
    tenant-domain-name: ""
    application-credential-id: ""
    application-credential-secret: ""
  networking: {}
  # [LoadBalancer] keys that the loadBalancer values above do not cover, for
  # example lb-method, create-monitor or monitor-delay.
  loadBalancer: {}
  blockStorage: {}
  metadata: {}
  route: {}

# Allow for specifying internal IP addresses for multiple hostnames
# hostAliases:
#   - ip: "10.0.0.1"
#     hostnames:
#     - "keystone.hostname.com"

## Pod priority settings
## ref: https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/
priorityClassName: ""

# Additional volumes that should be available to the pods:
extraVolumes: []
# Where the additional volumes should be mounted into the pods:
extraVolumeMounts: []

# Defaults to the name of the release.
serviceAccountName: ""
