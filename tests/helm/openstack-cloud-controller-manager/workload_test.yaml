suite: OCCM workload
templates:
  - templates/daemonset.yaml
  - templates/clusterrole.yaml
  - templates/clusterrolebinding.yaml
  - templates/role.yaml
  - templates/rolebinding.yaml

release:
  name: test-release
  namespace: test-namespace

chart:
  version: 1.2.3
  appVersion: v4.5.6

tests:
  - it: runs as a DaemonSet in the managed cluster by default
    template: templates/daemonset.yaml
    asserts:
      - isKind:
          of: DaemonSet
      - equal:
          path: spec.updateStrategy.type
          value: RollingUpdate
      - notExists:
          path: spec.replicas
      - equal:
          path: spec.template.spec.hostNetwork
          value: true
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --kubeconfig=/etc/kubernetes/occm-kubeconfig/kubeconfig
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: kubeconfig-volume
          any: true

  - it: creates the RBAC objects by default
    asserts:
      - isKind:
          of: ClusterRole
        template: templates/clusterrole.yaml
      - isKind:
          of: ClusterRoleBinding
        template: templates/clusterrolebinding.yaml
      - isKind:
          of: Role
        template: templates/role.yaml
      - isKind:
          of: RoleBinding
        template: templates/rolebinding.yaml

  - it: runs as a Deployment
    template: templates/daemonset.yaml
    set:
      kind: Deployment
      replicaCount: 2
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - notExists:
          path: spec.updateStrategy

  - it: rejects an unknown kind
    template: templates/daemonset.yaml
    set:
      kind: StatefulSet
    asserts:
      - failedTemplate:
          errorMessage: kind must be DaemonSet or Deployment, got "StatefulSet"

  - it: manages another cluster through a kubeconfig Secret
    template: templates/daemonset.yaml
    set:
      kubeconfig.secretName: mycluster-kubeconfig
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --kubeconfig=/etc/kubernetes/occm-kubeconfig/kubeconfig
      - contains:
          path: spec.template.spec.containers[0].args
          content: --authentication-kubeconfig=/etc/kubernetes/occm-kubeconfig/kubeconfig
      - contains:
          path: spec.template.spec.containers[0].args
          content: --authorization-kubeconfig=/etc/kubernetes/occm-kubeconfig/kubeconfig
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /etc/kubernetes/occm-kubeconfig
            name: kubeconfig-volume
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: kubeconfig-volume
            secret:
              secretName: mycluster-kubeconfig
              items:
                - key: value
                  path: kubeconfig

  - it: honours a custom kubeconfig key and mount path
    template: templates/daemonset.yaml
    set:
      kubeconfig.secretName: mycluster-kubeconfig
      kubeconfig.secretKey: admin.conf
      kubeconfig.mountPath: /var/run/occm/
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --kubeconfig=/var/run/occm/kubeconfig
      - contains:
          path: spec.template.spec.volumes
          content:
            name: kubeconfig-volume
            secret:
              secretName: mycluster-kubeconfig
              items:
                - key: admin.conf
                  path: kubeconfig

  - it: skips the RBAC objects when disabled
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/clusterrole.yaml
      - hasDocuments:
          count: 0
        template: templates/clusterrolebinding.yaml
      - hasDocuments:
          count: 0
        template: templates/role.yaml
      - hasDocuments:
          count: 0
        template: templates/rolebinding.yaml

  - it: binds the metrics port to the node only for a DaemonSet
    template: templates/daemonset.yaml
    set:
      kind: Deployment
      serviceMonitor.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 10258
      - notExists:
          path: spec.template.spec.containers[0].ports[0].hostPort

  - it: renders the management cluster example
    template: templates/daemonset.yaml
    values:
      - ../../../charts/openstack-cloud-controller-manager/ci/infra-values.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.hostNetwork
          value: false
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.tolerations
      - notExists:
          path: spec.template.spec.priorityClassName
      - contains:
          path: spec.template.spec.containers[0].args
          content: --controllers=cloud-node,cloud-node-lifecycle,service
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLUSTER_NAME
            value: mycluster
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 2
